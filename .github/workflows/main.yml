name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar unzip
        run: sudo apt-get install unzip -y

      - name: Descomprimir proyecto
        run: unzip femontv.zip -d project

      - name: Ver archivos
        run: ls -R project

      - name: Buscar carpeta real
        run: |
          cd project
          find . -name gradlew

      - name: Dar permisos a gradlew
        run: |
          cd project/*/
          chmod +x gradlew

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar APK
        run: |
          cd project/*/
          ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/**/app/build/outputs/apk/debug/*.apk
